<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#eef6f2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Next Generation Tennis Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f3f9f6 0%, #e7f2f8 48%, #f6f8ec 100%);
      --glass-bg: rgba(255, 255, 255, 0.66);
      --glass-bg-strong: rgba(255, 255, 255, 0.84);
      --glass-border: rgba(255, 255, 255, 0.85);
      --glass-shadow: 0 12px 32px rgba(15, 45, 35, 0.07), inset 0 1px 1px rgba(255, 255, 255, 0.95);
      --glass-shadow-sm: 0 6px 18px rgba(15, 45, 35, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      --primary: #0f766e;
      --primary-light: #14b8a6;
      --accent: #65a30d;
      --accent-soft: rgba(101, 163, 13, 0.14);
      --text-main: #0f172a;
      --text-muted: #475569;
      --danger: #dc2626;
      --warning: #d97706;
      --radius-xl: 26px;
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 105px;
      position: relative;
    }

    /* Ambient Liquid Blobs */
    .liquid-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(65px);
      z-index: -1;
      opacity: 0.65;
      pointer-events: none;
      animation: floatOrb 14s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, #99f6e4, #bae6fd);
      top: -60px;
      right: -50px;
    }
    .orb-2 {
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, #d9f99d, #a7f3d0);
      bottom: 80px;
      left: -70px;
      animation-delay: -5s;
    }
    .orb-3 {
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, #e0f2fe, #fef08a);
      top: 42%;
      right: 25%;
      animation-delay: -9s;
    }
    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-18px, 24px) scale(1.08); }
    }

    /* Liquid Glass Utility */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(185%);
      -webkit-backdrop-filter: blur(22px) saturate(185%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow-sm);
      border-radius: var(--radius-lg);
      padding: 16px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    /* App Container */
    .app-shell {
      max-width: 540px;
      margin: 0 auto;
      padding: 14px 16px;
    }

    /* Top Header */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-radius: var(--radius-xl);
      margin-bottom: 16px;
      position: sticky;
      top: 10px;
      z-index: 40;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #0f766e, #65a30d);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      box-shadow: 0 6px 14px rgba(15, 118, 110, 0.25);
    }

    .brand-text h1 {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.2;
    }

    .brand-text span {
      font-size: 11px;
      color: var(--primary);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
      box-shadow: 0 0 8px #10b981;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-pill {
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
      transition: all 0.2s;
    }
    .icon-pill:active { transform: scale(0.95); }

    /* Role Banner */
    .role-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      margin-bottom: 14px;
      font-size: 12.5px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.85);
    }

    .badge {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .badge-teal { background: rgba(20, 184, 166, 0.15); color: #0f766e; }
    .badge-lime { background: rgba(101, 163, 13, 0.16); color: #4d7c0f; }
    .badge-amber { background: rgba(245, 158, 11, 0.16); color: #b45309; }
    .badge-red { background: rgba(239, 68, 68, 0.15); color: #b91c1c; }

    /* Hero Card */
    .hero-card {
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.88), rgba(20, 184, 166, 0.82));
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: var(--radius-xl);
      padding: 20px;
      color: #fff;
      margin-bottom: 16px;
      box-shadow: 0 14px 30px rgba(15, 118, 110, 0.22);
      position: relative;
      overflow: hidden;
    }
    .hero-card::after {
      content: '';
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      top: -40px;
      left: -30px;
    }
    .hero-card h2 { font-size: 19px; font-weight: 800; margin-bottom: 4px; }
    .hero-card p { font-size: 13px; opacity: 0.92; line-height: 1.5; }

    /* Grid Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-box {
      padding: 14px;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .stat-icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: rgba(20, 184, 166, 0.14);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .stat-info h3 { font-size: 20px; font-weight: 800; line-height: 1.1; }
    .stat-info span { font-size: 12px; color: var(--text-muted); font-weight: 600; }

    /* Section Header */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 14px 0 10px;
    }
    .section-head h3 {
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* Buttons */
    .btn {
      border: none;
      border-radius: 13px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      color: #fff;
      box-shadow: 0 6px 16px rgba(15, 118, 110, 0.24);
    }
    .btn-accent {
      background: linear-gradient(135deg, #65a30d, #84cc16);
      color: #fff;
      box-shadow: 0 6px 16px rgba(101, 163, 13, 0.24);
    }
    .btn-glass {
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.95);
      color: var(--text-main);
    }
    .btn-danger {
      background: rgba(220, 38, 38, 0.12);
      color: var(--danger);
    }
    .btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 10px; }
    .btn-block { width: 100%; }

    /* Cards List */
    .cards-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cover-img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 10px;
      background: #e2e8f0;
    }

    .avatar-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar-img {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      object-fit: cover;
      border: 2px solid #fff;
      background: #cbd5e1;
      flex-shrink: 0;
    }

    .meta-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .meta-chip {
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.9);
      padding: 4px 9px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
    }

    .note-box {
      margin-top: 9px;
      padding: 8px 11px;
      border-radius: 11px;
      background: rgba(254, 243, 199, 0.55);
      border: 1px solid rgba(251, 191, 36, 0.35);
      font-size: 12px;
      color: #78350f;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 11px;
      padding-top: 10px;
      border-top: 1px solid rgba(15, 23, 42, 0.06);
      flex-wrap: wrap;
    }

    /* Bottom Liquid Glass Dock (5 Icons) */
    .bottom-dock {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 500px;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(26px) saturate(200%);
      -webkit-backdrop-filter: blur(26px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 14px 36px rgba(15, 45, 35, 0.14), inset 0 1px 1px #fff;
      border-radius: 26px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 7px 6px;
      z-index: 50;
    }

    .dock-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 2px;
      border-radius: 18px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.22s ease;
    }

    .dock-item.active {
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.14), rgba(101, 163, 13, 0.14));
      color: var(--primary);
      transform: translateY(-2px);
    }

    /* Side Drawer (More Menu) */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.28);
      backdrop-filter: blur(4px);
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .side-drawer {
      position: fixed;
      top: 12px;
      bottom: 12px;
      left: 12px;
      width: 285px;
      max-width: 82vw;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid #fff;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.18);
      z-index: 70;
      padding: 20px 16px;
      transform: translateX(-115%);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .side-drawer.open {
      transform: translateX(0);
    }

    .drawer-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.55);
      color: var(--text-main);
      font-size: 13.5px;
      font-weight: 700;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .drawer-link:hover, .drawer-link.active {
      background: rgba(20, 184, 166, 0.14);
      color: var(--primary);
      border-color: rgba(20, 184, 166, 0.3);
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.36);
      backdrop-filter: blur(6px);
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }

    .modal-box {
      width: 100%;
      max-width: 440px;
      max-height: 88vh;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(28px);
      border: 1px solid #fff;
      border-radius: 26px;
      padding: 20px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.2);
    }

    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 5px;
      color: var(--text-main);
    }
    .form-control {
      width: 100%;
      padding: 10px 13px;
      border-radius: 13px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(255, 255, 255, 0.85);
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-control:focus { border-color: var(--primary); }

    .tabs-row {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      background: rgba(255, 255, 255, 0.5);
      padding: 5px;
      border-radius: 14px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      border-radius: 10px;
      border: none;
      background: transparent;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
    }
    .tab-btn.active {
      background: #fff;
      color: var(--primary);
      box-shadow: 0 3px 10px rgba(0,0,0,0.06);
    }

    .empty-state {
      text-align: center;
      padding: 34px 18px;
      border-radius: var(--radius-xl);
    }
    .empty-state p {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-top: 8px;
      line-height: 1.6;
    }

    .loader {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(15, 118, 110, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 30px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      z-index: 100;
      transition: transform 0.3s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="liquid-orb orb-1"></div>
  <div class="liquid-orb orb-2"></div>
  <div class="liquid-orb orb-3"></div>

  <div id="toast" class="toast"></div>

  <div class="app-shell">
    <!-- Top Header -->
    <header class="top-bar glass">
      <div class="brand">
        <div class="brand-logo">NXT</div>
        <div class="brand-text">
          <h1>Next Generation</h1>
          <span><i class="sync-dot"></i> تحديث تلقائي متصل بالشيت</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-pill" onclick="refreshData(true)" title="تحديث البيانات الآن">
          <i data-lucide="refresh-cw" style="width:14px;height:14px;"></i>
        </button>
        <button id="authHeaderBtn" class="icon-pill" onclick="openLoginModal()">
          <i data-lucide="log-in" style="width:14px;height:14px;"></i>
          <span>دخول</span>
        </button>
      </div>
    </header>

    <!-- User Role Status Strip -->
    <div class="role-strip">
      <div id="roleInfoText">مرحباً بك كزائر في الأكاديمية</div>
      <span id="roleBadge" class="badge badge-teal">وضع الزائر</span>
    </div>

    <!-- Main Dynamic View Container -->
    <main id="mainContent">
      <div class="loader"></div>
    </main>
  </div>

  <!-- Bottom Navigation Bar (5 Icons) -->
  <nav class="bottom-dock">
    <button class="dock-item active" data-view="home" onclick="navigate('home')">
      <i data-lucide="home" style="width:20px;height:20px;"></i>
      <span>الرئيسية</span>
    </button>
    <button class="dock-item" data-view="teams" onclick="navigate('teams')">
      <i data-lucide="shield" style="width:20px;height:20px;"></i>
      <span>الفرق</span>
    </button>
    <button class="dock-item" data-view="players" onclick="navigate('players')">
      <i data-lucide="users" style="width:20px;height:20px;"></i>
      <span>اللاعبين</span>
    </button>
    <button class="dock-item" data-view="schedule" onclick="navigate('schedule')">
      <i data-lucide="calendar" style="width:20px;height:20px;"></i>
      <span>المواعيد</span>
    </button>
    <button class="dock-item" data-view="more" onclick="toggleDrawer(true)">
      <i data-lucide="layout-grid" style="width:20px;height:20px;"></i>
      <span>المزيد</span>
    </button>
  </nav>

  <!-- Side Drawer for Remaining Sheets -->
  <div id="drawerBackdrop" class="drawer-backdrop" onclick="toggleDrawer(false)"></div>
  <aside id="sideDrawer" class="side-drawer">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
      <div>
        <h3 style="font-size:16px;font-weight:800;">أقسام الأكاديمية</h3>
        <span style="font-size:11.5px;color:var(--text-muted);">باقي الشيتات والخدمات</span>
      </div>
      <button class="icon-pill" onclick="toggleDrawer(false)">
        <i data-lucide="x" style="width:16px;height:16px;"></i>
      </button>
    </div>

    <div id="drawerLinksContainer"></div>

    <div style="margin-top:auto;padding-top:14px;border-top:1px solid rgba(0,0,0,0.06);">
      <button id="drawerAuthBtn" class="btn btn-primary btn-block" onclick="toggleDrawer(false); openLoginModal();">
        <i data-lucide="key-round" style="width:16px;height:16px;"></i>
        تسجيل الدخول / تغيير الحساب
      </button>
    </div>
  </aside>

  <!-- Login Modal -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal-box">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <h3 style="font-size:17px;font-weight:800;">تسجيل الدخول للأكاديمية</h3>
        <button class="icon-pill" onclick="closeModal('loginModal')"><i data-lucide="x" style="width:15px;height:15px;"></i></button>
      </div>

      <div class="tabs-row">
        <button class="tab-btn active" id="tabParent" onclick="setLoginMode('parent')">ولي أمر / لاعب</button>
        <button class="tab-btn" id="tabStaff" onclick="setLoginMode('staff')">مدرب / إدارة</button>
      </div>

      <div class="form-group">
        <label>البريد الإلكتروني المسجل</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="example@domain.com" dir="ltr" />
      </div>

      <div class="form-group" id="loginCodeGroup" style="display:none;">
        <label>رمز الدخول (Login Code)</label>
        <input type="password" id="loginCode" class="form-control" placeholder="أدخل الكود الخاص بك" dir="ltr" />
      </div>

      <p id="loginHintText" style="font-size:12px;color:var(--text-muted);margin-bottom:14px;line-height:1.5;">
        يدخل ولي الأمر بالبريد الإلكتروني المسجل في شيت اللاعبين مباشرة بدون كود.
      </p>

      <button class="btn btn-primary btn-block" onclick="submitLogin()">دخول</button>

      <div style="margin-top:14px;padding-top:12px;border-top:1px solid rgba(0,0,0,0.07);text-align:center;">
        <span style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:6px;">لاعب جديد غير مسجل بعد؟</span>
        <button class="btn btn-glass btn-sm btn-block" onclick="closeModal('loginModal'); navigate('admin');">
          الذهاب لصفحة الإدارة وملء استمارة التسجيل
        </button>
      </div>
    </div>
  </div>

  <!-- CRUD / Edit Modal -->
  <div id="crudModal" class="modal-overlay">
    <div class="modal-box">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <h3 id="crudModalTitle" style="font-size:16px;font-weight:800;">تعديل البيانات</h3>
        <button class="icon-pill" onclick="closeModal('crudModal')"><i data-lucide="x" style="width:15px;height:15px;"></i></button>
      </div>
      <form id="crudForm" onsubmit="submitCrudForm(event)"></form>
    </div>
  </div>

  <script>
    // =========================================================================
    // ضع هنا رابط النشر (Web App URL) الخاص بكود Google Apps Script
    // =========================================================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbw3-iYGotn4n0GX6n1HjaGhMdQgK1-la4kBZCkD31fFZMNHBdLxexCf6VUKBWXQ2f05/exec';

    let appState = {
      currentView: 'home',
      loginMode: 'parent',
      user: JSON.parse(localStorage.getItem('nxtgen_user') || 'null'),
      data: null,
      autoSyncTimer: null
    };

    const ROLE_LABELS = {
      super_admin: { text: 'المدير العام (صلاحية كاملة)', badge: 'badge-lime' },
      admin_staff: { text: 'فريق الإدارة', badge: 'badge-teal' },
      coach: { text: 'مدرب معتمد', badge: 'badge-teal' },
      parent: { text: 'ولي أمر لاعب', badge: 'badge-lime' },
      guest: { text: 'وضع الزائر', badge: 'badge-amber' }
    };

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      updateAuthUI();
      refreshData(false);
      // Auto-sync every 20 seconds so any change in Google Sheet reflects automatically
      appState.autoSyncTimer = setInterval(() => refreshData(false, true), 20000);
    });

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3400);
    }

    function updateAuthUI() {
      const u = appState.user;
      const roleInfo = document.getElementById('roleInfoText');
      const roleBadge = document.getElementById('roleBadge');
      const headerBtn = document.getElementById('authHeaderBtn');
      const drawerBtn = document.getElementById('drawerAuthBtn');

      if (u && u.role && u.role !== 'guest') {
        const meta = ROLE_LABELS[u.role] || ROLE_LABELS.guest;
        roleInfo.innerHTML = `أهلاً، <strong>${escapeHtml(u.name || '')}</strong>`;
        roleBadge.className = `badge ${meta.badge}`;
        roleBadge.textContent = meta.text;
        headerBtn.innerHTML = `<i data-lucide="log-out" style="width:14px;height:14px;"></i><span>خروج</span>`;
        headerBtn.onclick = logoutUser;
        drawerBtn.innerHTML = `<i data-lucide="log-out" style="width:16px;height:16px;"></i> تسجيل الخروج (${escapeHtml(u.name || '')})`;
        drawerBtn.onclick = () => { toggleDrawer(false); logoutUser(); };
      } else {
        roleInfo.textContent = 'تصفح كزائر (سجل دخولك لعرض بياناتك)';
        roleBadge.className = 'badge badge-amber';
        roleBadge.textContent = 'وضع الزائر';
        headerBtn.innerHTML = `<i data-lucide="log-in" style="width:14px;height:14px;"></i><span>دخول</span>`;
        headerBtn.onclick = openLoginModal;
        drawerBtn.innerHTML = `<i data-lucide="key-round" style="width:16px;height:16px;"></i> تسجيل الدخول للحساب`;
        drawerBtn.onclick = () => { toggleDrawer(false); openLoginModal(); };
      }
      renderDrawerLinks();
      lucide.createIcons();
    }

    function renderDrawerLinks() {
      const role = appState.user?.role || 'guest';
      const isStaff = ['super_admin', 'admin_staff', 'coach'].includes(role);
      const isParent = role === 'parent';

      const items = [
        { id: 'private', label: 'حصص البرايفت (Private)', icon: 'sparkles', visible: true },
        { id: 'education', label: 'المحتوى التعليمي', icon: 'play-circle', visible: true },
        { id: 'coaches', label: 'المدربون', icon: 'award', visible: true },
        { id: 'subscriptions', label: 'الاشتراكات والمدفوعات', icon: 'credit-card', visible: isStaff || isParent },
        { id: 'admin', label: 'الإدارة وتسجيل اللاعبين', icon: 'building-2', visible: true },
        { id: 'responses', label: 'طلبات التسجيل الجديدة', icon: 'file-check', visible: ['super_admin', 'admin_staff'].includes(role) }
      ];

      const container = document.getElementById('drawerLinksContainer');
      container.innerHTML = items.filter(i => i.visible).map(item => `
        <button class="drawer-link ${appState.currentView === item.id ? 'active' : ''}"
                onclick="toggleDrawer(false); navigate('${item.id}')">
          <span style="display:flex;align-items:center;gap:10px;">
            <i data-lucide="${item.icon}" style="width:18px;height:18px;color:var(--primary);"></i>
            ${item.label}
          </span>
          <i data-lucide="chevron-left" style="width:16px;height:16px;opacity:0.5;"></i>
        </button>
      `).join('');
      lucide.createIcons();
    }

    async function refreshData(manual = false, silent = false) {
      if (!silent) {
        document.getElementById('mainContent').innerHTML = '<div class="loader"></div>';
      }
      try {
        const u = appState.user || {};
        const url = new URL(API_URL);
        url.searchParams.set('action', 'getData');
        if (u.email) url.searchParams.set('authEmail', u.email);
        if (u.code) url.searchParams.set('authCode', u.code);

        const res = await fetch(url.toString());
        const json = await res.json();
        if (json.status === 'success') {
          appState.data = json;
          renderCurrentView();
          if (manual) showToast('تم تحديث البيانات من الشيت بنجاح');
        } else {
          if (!silent) showToast(json.message || 'تعذر تحميل البيانات');
        }
      } catch (err) {
        if (!silent) {
          document.getElementById('mainContent').innerHTML = `
            <div class="glass-card empty-state">
              <i data-lucide="wifi-off" style="width:36px;height:36px;color:var(--danger);"></i>
              <h3 style="margin-top:8px;">تعذر الاتصال بقاعدة البيانات</h3>
              <p>تأكد من ربط رابط Google Apps Script بشكل صحيح ومن توفر اتصال بالإنترنت.</p>
              <button class="btn btn-primary" style="margin-top:12px;" onclick="refreshData(true)">إعادة المحاولة</button>
            </div>`;
          lucide.createIcons();
        }
      }
    }

    function navigate(view) {
      appState.currentView = view;
      document.querySelectorAll('.dock-item').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === view);
      });
      renderDrawerLinks();
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleDrawer(open) {
      document.getElementById('sideDrawer').classList.toggle('open', open);
      document.getElementById('drawerBackdrop').classList.toggle('open', open);
    }

    function openLoginModal() {
      document.getElementById('loginModal').classList.add('open');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    function setLoginMode(mode) {
      appState.loginMode = mode;
      document.getElementById('tabParent').classList.toggle('active', mode === 'parent');
      document.getElementById('tabStaff').classList.toggle('active', mode === 'staff');
      document.getElementById('loginCodeGroup').style.display = mode === 'staff' ? 'block' : 'none';
      document.getElementById('loginHintText').textContent = mode === 'parent'
        ? 'يدخل ولي الأمر بالبريد الإلكتروني المسجل في شيت اللاعبين مباشرة بدون كود.'
        : 'يدخل المدربون والإدارة بالبريد الإلكتروني مع رمز الدخول (Login Code).';
    }

    async function submitLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const code = document.getElementById('loginCode').value.trim();

      if (!email) {
        showToast('يرجى إدخال البريد الإلكتروني');
        return;
      }
      if (appState.loginMode === 'staff' && !code) {
        showToast('يرجى إدخال رمز الدخول (Login Code)');
        return;
      }

      try {
        const url = new URL(API_URL);
        url.searchParams.set('action', 'login');
        url.searchParams.set('email', email);
        if (code) url.searchParams.set('code', code);

        const res = await fetch(url.toString());
        const json = await res.json();

        if (json.status === 'success') {
          appState.user = { ...json.user, code: code };
          localStorage.setItem('nxtgen_user', JSON.stringify(appState.user));
          closeModal('loginModal');
          updateAuthUI();
          showToast(`مرحباً بك ${json.user.name}`);
          refreshData(false);
        } else if (json.status === 'pending') {
          closeModal('loginModal');
          alert(json.message);
        } else {
          showToast(json.message || 'بيانات الدخول غير صحيحة');
        }
      } catch (e) {
        showToast('حدث خطأ أثناء تسجيل الدخول');
      }
    }

    function logoutUser() {
      appState.user = null;
      localStorage.removeItem('nxtgen_user');
      updateAuthUI();
      showToast('تم تسجيل الخروج');
      navigate('home');
      refreshData(false);
    }

    // =========================================================================
    // VIEW RENDERERS
    // =========================================================================
    function renderCurrentView() {
      if (!appState.data) return;
      const view = appState.currentView;
      const container = document.getElementById('mainContent');

      const renderers = {
        home: renderHomeView,
        teams: renderTeamsView,
        players: renderPlayersView,
        schedule: renderScheduleView,
        private: renderPrivateView,
        education: renderEducationView,
        coaches: renderCoachesView,
        subscriptions: renderSubscriptionsView,
        admin: renderAdminView,
        responses: renderResponsesView
      };

      container.innerHTML = (renderers[view] || renderHomeView)();
      lucide.createIcons();
    }

    function renderHomeView() {
      const { stats, sheets, registrationFormUrl } = appState.data;
      const role = appState.user?.role || 'guest';
      const isGuest = role === 'guest';

      let quickCards = `
        <div class="hero-card">
          <h2>Next Generation Tennis Academy</h2>
          <p>منصة إدارة ومتابعة تدريبات التنس واللياقة — جميع الجداول والفرق محدثة لحظياً.</p>
          ${isGuest ? `
            <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn btn-glass btn-sm" onclick="openLoginModal()">تسجيل الدخول</button>
              ${registrationFormUrl ? `<a href="${registrationFormUrl}" target="_blank" class="btn btn-accent btn-sm" style="text-decoration:none;">تسجيل لاعب جديد</a>` : ''}
            </div>` : ''}
        </div>

        <div class="stats-grid">
          <div class="stat-box glass-card" onclick="navigate('teams')" style="cursor:pointer;">
            <div class="stat-icon"><i data-lucide="shield"></i></div>
            <div class="stat-info"><h3>${stats.teamsCount}</h3><span>الفرق التدريبية</span></div>
          </div>
          <div class="stat-box glass-card" onclick="navigate('coaches')" style="cursor:pointer;">
            <div class="stat-icon"><i data-lucide="award"></i></div>
            <div class="stat-info"><h3>${stats.coachesCount}</h3><span>المدربون</span></div>
          </div>
          <div class="stat-box glass-card" onclick="navigate('education')" style="cursor:pointer;">
            <div class="stat-icon"><i data-lucide="play-circle"></i></div>
            <div class="stat-info"><h3>${stats.eduCount}</h3><span>المحتوى التعليمي</span></div>
          </div>
          <div class="stat-box glass-card" onclick="navigate('${isGuest ? 'admin' : 'schedule'}')" style="cursor:pointer;">
            <div class="stat-icon"><i data-lucide="${isGuest ? 'building-2' : 'calendar'}"></i></div>
            <div class="stat-info"><h3>${isGuest ? 'تواصل' : stats.sessionsCount}</h3><span>${isGuest ? 'الإدارة والتسجيل' : 'الحصص المتاحة'}</span></div>
          </div>
        </div>
      `;

      // Highlight next schedule for logged-in users
      if (!isGuest && sheets.schedule.length > 0) {
        const nextSessions = sheets.schedule.slice(0, 3);
        quickCards += `
          <div class="section-head">
            <h3><i data-lucide="clock" style="width:18px;height:18px;color:var(--primary);"></i> أقرب مواعيد التمارين</h3>
            <button class="btn btn-glass btn-sm" onclick="navigate('schedule')">عرض الكل</button>
          </div>
          <div class="cards-stack">
            ${nextSessions.map(s => `
              <div class="glass-card">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                  <strong>${escapeHtml(s['عنوان التمرين / الحصة'])}</strong>
                  <span class="badge badge-teal">${escapeHtml(s['معرف الفريق'])}</span>
                </div>
                <div class="meta-list">
                  <span class="meta-chip"><i data-lucide="calendar" style="width:13px;height:13px;"></i> ${escapeHtml(s['اليوم'])}</span>
                  <span class="meta-chip"><i data-lucide="clock" style="width:13px;height:13px;"></i> ${escapeHtml(s['التوقيت'])}</span>
                  <span class="meta-chip"><i data-lucide="map-pin" style="width:13px;height:13px;"></i> ${escapeHtml(s['الملعب'])}</span>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      return quickCards;
    }

    function renderTeamsView() {
      const teams = appState.data.sheets.teams || [];
      const players = appState.data.sheets.players || [];
      const role = appState.user?.role || 'guest';
      const canEdit = ['super_admin', 'admin_staff'].includes(role);
      const canSeeTeamPlayers = ['super_admin', 'admin_staff', 'coach'].includes(role);

      return `
        <div class="section-head">
          <h3><i data-lucide="shield" style="width:19px;height:19px;color:var(--primary);"></i> الفرق التدريبية</h3>
          ${canEdit ? `<button class="btn btn-primary btn-sm" onclick="openAddTeamModal()"><i data-lucide="plus" style="width:15px;height:15px;"></i> إضافة فريق</button>` : ''}
        </div>
        <div class="cards-stack">
          ${teams.map((t, idx) => {
            const altCode = 'T-10' + (idx + 1);
            const teamPlayers = canSeeTeamPlayers
              ? players.filter(p => p['Team_ID'] === t['معرف الفريق'] || p['Team_ID'] === altCode)
              : [];
            return `
              <div class="glass-card">
                ${t['cover'] ? `<img src="${escapeHtml(t['cover'])}" class="cover-img" onerror="this.style.display='none'">` : ''}
                <div style="display:flex;justify-content:space-between;align-items:start;">
                  <div>
                    <h4 style="font-size:15.5px;font-weight:800;">${escapeHtml(t['اسم الفريق / الفئة'])}</h4>
                    <span style="font-size:12px;color:var(--primary);font-weight:700;">كود الفريق: ${escapeHtml(t['معرف الفريق'])}</span>
                  </div>
                  <span class="badge badge-lime">${escapeHtml(t['نوع الرياضة'])}</span>
                </div>
                <div class="meta-list">
                  <span class="meta-chip"><i data-lucide="user-check" style="width:13px;height:13px;"></i> ${escapeHtml(t['اسم المدرب'])}</span>
                  <span class="meta-chip"><i data-lucide="layers" style="width:13px;height:13px;"></i> ${escapeHtml(t['الفئة العمرية / المستوى'])}</span>
                </div>
                ${canSeeTeamPlayers ? `
                  <div style="margin-top:9px;font-size:12px;color:var(--text-muted);">
                    <strong>اللاعبون المنضمون (${teamPlayers.length}):</strong>
                    ${teamPlayers.length ? teamPlayers.map(p => escapeHtml(p['Player_Name'])).join('، ') : 'لا يوجد لاعبون مسجلون حالياً'}
                  </div>` : ''}
                ${canEdit ? `
                  <div class="card-actions">
                    <button class="btn btn-glass btn-sm" onclick='openEditTeamModal(${JSON.stringify(t)})'>تعديل</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteRow('teams', ${t._rowIndex})">حذف الفريق</button>
                  </div>` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderPlayersView() {
      const role = appState.user?.role || 'guest';
      if (role === 'guest') {
        return `
          <div class="glass-card empty-state">
            <i data-lucide="lock" style="width:38px;height:38px;color:var(--primary);"></i>
            <h3 style="margin-top:8px;">بيانات اللاعبين محمية</h3>
            <p>يرجى تسجيل الدخول بحساب ولي الأمر أو المدرب أو الإدارة للاطلاع على البيانات المصرح بها.</p>
            <button class="btn btn-primary" style="margin-top:12px;" onclick="openLoginModal()">تسجيل الدخول</button>
          </div>`;
      }

      const players = appState.data.sheets.players || [];
      const isSuperAdmin = role === 'super_admin';
      const isAdmin = ['super_admin', 'admin_staff'].includes(role);
      const isCoach = role === 'coach';

      return `
        <div class="section-head">
          <h3><i data-lucide="users" style="width:19px;height:19px;color:var(--primary);"></i> ${role === 'parent' ? 'بيانات اللاعب الخاص بك' : 'قائمة اللاعبين'}</h3>
          ${isAdmin ? `<button class="btn btn-primary btn-sm" onclick="openAddPlayerModal()"><i data-lucide="plus" style="width:15px;height:15px;"></i> إضافة لاعب</button>` : ''}
        </div>
        <div class="cards-stack">
          ${players.length === 0 ? `<div class="glass-card empty-state"><p>لا توجد بيانات لاعبين متاحة لهذا الحساب.</p></div>` : ''}
          ${players.map(p => `
            <div class="glass-card">
              <div class="avatar-row">
                <img src="${escapeHtml(p['cover'] || '')}" class="avatar-img" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(p['Player_Name'] || 'P')}&background=0f766e&color=fff'">
                <div style="flex:1;">
                  <div style="display:flex;justify-content:space-between;align-items:center;">
                    <h4 style="font-size:15.5px;font-weight:800;">${escapeHtml(p['Player_Name'])}</h4>
                    <span class="badge badge-teal">${escapeHtml(p['Team_ID'])}</span>
                  </div>
                  <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">
                    ولي الأمر: ${escapeHtml(p['Parent_Name'])} • كود: ${escapeHtml(p['Player_ID'])}
                  </div>
                </div>
              </div>
              <div class="meta-list">
                <span class="meta-chip"><i data-lucide="phone" style="width:13px;height:13px;"></i> ${escapeHtml(p['Parent_Phone'])}</span>
                ${isSuperAdmin && p['Parent_Email'] ? `<span class="meta-chip"><i data-lucide="mail" style="width:13px;height:13px;"></i> ${escapeHtml(p['Parent_Email'])}</span>` : ''}
              </div>
              ${p['ملاحظات'] ? `<div class="note-box"><strong>ملاحظات المدرب:</strong> ${escapeHtml(p['ملاحظات'])}</div>` : ''}
              ${(isAdmin || isCoach) ? `
                <div class="card-actions">
                  <button class="btn btn-glass btn-sm" onclick='openEditPlayerModal(${JSON.stringify(p)})'>
                    <i data-lucide="edit-3" style="width:13px;height:13px;"></i> ${isCoach ? 'تعديل / إضافة ملاحظة' : 'تعديل البيانات والصورة'}
                  </button>
                  ${isAdmin ? `<button class="btn btn-danger btn-sm" onclick="deleteRow('players', ${p._rowIndex})">حذف</button>` : ''}
                </div>` : ''}
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderScheduleView() {
      const role = appState.user?.role || 'guest';
      if (role === 'guest') {
        return `
          <div class="glass-card empty-state">
            <i data-lucide="calendar-off" style="width:38px;height:38px;color:var(--primary);"></i>
            <h3 style="margin-top:8px;">مواعيد التمارين للأعضاء فقط</h3>
            <p>سجل دخولك لمتابعة مواعيد تمرين فريقك والملعب والمدرب المسؤول.</p>
            <button class="btn btn-primary" style="margin-top:12px;" onclick="openLoginModal()">تسجيل الدخول</button>
          </div>`;
      }

      const schedule = appState.data.sheets.schedule || [];
      const isAdmin = ['super_admin', 'admin_staff'].includes(role);
      const isCoach = role === 'coach';

      return `
        <div class="section-head">
          <h3><i data-lucide="calendar" style="width:19px;height:19px;color:var(--primary);"></i> جدول المواعيد والتمارين</h3>
          ${isAdmin ? `<button class="btn btn-primary btn-sm" onclick="openAddScheduleModal()"><i data-lucide="plus" style="width:15px;height:15px;"></i> إضافة موعد</button>` : ''}
        </div>
        <div class="cards-stack">
          ${schedule.length === 0 ? `<div class="glass-card empty-state"><p>لا توجد مواعيد تمارين مسجلة حالياً.</p></div>` : ''}
          ${schedule.map(s => `
            <div class="glass-card">
              <div style="display:flex;justify-content:space-between;align-items:start;gap:8px;">
                <div>
                  <h4 style="font-size:15px;font-weight:800;">${escapeHtml(s['عنوان التمرين / الحصة'])}</h4>
                  <span style="font-size:11.5px;color:var(--text-muted);">كود الحصة: ${escapeHtml(s['معرف الحصة'])}</span>
                </div>
                <span class="badge badge-lime">${escapeHtml(s['معرف الفريق'])}</span>
              </div>
              <div class="meta-list">

    // =========================================================================
    // CRUD & WRITE OPERATIONS
    // =========================================================================
    let currentCrudContext = null;

    function openCrudForm(title, fields, context) {
      currentCrudContext = context;
      document.getElementById('crudModalTitle').textContent = title;
      const form = document.getElementById('crudForm');
      form.innerHTML = fields.map(f => `
        <div class="form-group">
          <label>${f.label}</label>
          <input type="${f.type || 'text'}" name="${f.name}" value="${escapeHtml(f.value || '')}"
                 class="form-control" ${f.required ? 'required' : ''} ${f.readonly ? 'readonly' : ''} />
        </div>
      `).join('') + `<button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">حفظ التعديلات في الشيت</button>`;
      document.getElementById('crudModal').classList.add('open');
    }

    async function submitCrudForm(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const payload = {};
      formData.forEach((val, key) => { payload[key] = val; });

      await sendWriteRequest({
        op: currentCrudContext.op,
        target: currentCrudContext.target,
        rowIndex: currentCrudContext.rowIndex,
        payload
      });
      closeModal('crudModal');
    }

    async function sendWriteRequest(body) {
      const u = appState.user || {};
      try {
        showToast('جاري الحفظ في جوجل شيت...');
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'write',
            authEmail: u.email || '',
            authCode: u.code || '',
            ...body
          })
        });
        const json = await res.json();
        showToast(json.message || 'تم التنفيذ');
        if (json.status === 'success') {
          refreshData(false, true);
        }
      } catch (err) {
        showToast('حدث خطأ أثناء الاتصال بالشيت');
      }
    }

    function deleteRow(target, rowIndex) {
      if (!confirm('هل أنت متأكد من الحذف نهائياً من الشيت؟')) return;
      sendWriteRequest({ op: 'delete', target, rowIndex });
    }

        { name: 'معرف الحصة', label: 'معرف الحصة (مثال: prv-014)', required: true },
        { name: 'معرف الفريق', label: 'الفريق (مثال: Green 1)', required: true },
        { name: 'اسم اللاعب', label: 'اسم اللاعب (مطابق لاسم اللاعب في الشيت)', required: true },
        { name: 'اليوم', label: 'التاريخ', type: 'date', required: true },
        { name: 'التوقيت', label: 'التوقيت (مثال: 18:00:00)', required: true },
        { name: 'الملعب', label: 'الملعب', required: true },
        { name: 'المدرب المسؤول', label: 'المدرب المسؤول', value: coachName, required: true }
      ], { op: 'add', target: 'private' });
    }

    function openEditPrivateModal(pr) {
      openCrudForm('تعديل حصة Private', [
        { name: 'اسم اللاعب', label: 'اسم اللاعب', value: pr['اسم اللاعب'], required: true },
        { name: 'اليوم', label: 'التاريخ', value: pr['اليوم'], required: true },
        { name: 'التوقيت', label: 'التوقيت', value: pr['التوقيت'], required: true },
        { name: 'الملعب', label: 'الملعب', value: pr['الملعب'], required: true },
        { name: 'المدرب المسؤول', label: 'المدرب المسؤول', value: pr['المدرب المسؤول'] }
      ], { op: 'update', target: 'private', rowIndex: pr._rowIndex });
    }

    function openAddCoachModal() {
      const isSuperAdmin = appState.user?.role === 'super_admin';
      const fields = [
        { name: 'كود المدرب', label: 'كود المدرب (مثال: C005)', required: true },
        { name: 'اسم المدرب', label: 'اسم المدرب', required: true },
        { name: 'رقم المدرب', label: 'رقم هاتف المدرب', required: true },
        { name: 'الفرع', label: 'الفرع', value: 'Qatameya', required: true }
      ];
      if (isSuperAdmin) {
        fields.push(
          { name: 'ايميل المدرب', label: 'ايميل المدرب للدخول', type: 'email', required: true },
          { name: 'login code', label: 'رمز الدخول (Login Code)', required: true }
        );
      }
      openCrudForm('إضافة مدرب جديد', fields, { op: 'add', target: 'coaches' });
    }

    function openEditCoachModal(c) {
      const isSuperAdmin = appState.user?.role === 'super_admin';
      const fields = [
        { name: 'اسم المدرب', label: 'اسم المدرب', value: c['اسم المدرب'], required: true },
        { name: 'رقم المدرب', label: 'رقم المدرب', value: c['رقم المدرب'], required: true },
        { name: 'الفرع', label: 'الفرع', value: c['الفرع'] }
      ];
      if (isSuperAdmin) {
        fields.push(
          { name: 'ايميل المدرب', label: 'ايميل المدرب', value: c['ايميل المدرب'] },
          { name: 'login code', label: 'رمز الدخول (Login Code)', value: c['login code'] }
        );
      }
      openCrudForm('تعديل بيانات المدرب', fields, { op: 'update', target: 'coaches', rowIndex: c._rowIndex });
    }

    function openAddEduModal() {
      openCrudForm('إضافة محتوى تعليمي جديد', [
        { name: 'معرف المحتوى', label: 'معرف المحتوى (مثال: EDU-104)', required: true },
        { name: 'عنوان الدرس', label: 'عنوان الدرس', required: true },
        { name: 'نوع الرياضة / التصنيف', label: 'التصنيف (تنس / بادل / لياقة)', required: true },
        { name: 'نوع الوسائط', label: 'نوع الوسائط (فيديو / مقال)', required: true },
        { name: 'رابط المادة', label: 'رابط المادة', required: true },
        { name: 'الفئة المستهدفة', label: 'الفئة المستهدفة', value: 'جميع اللاعبين' },
        { name: 'cover', label: 'رابط صورة الغلاف' }
      ], { op: 'add', target: 'education' });
    }

    function openAddSubModal() {
      openCrudForm('إضافة حالة اشتراك', [
        { name: 'كود اللاعب', label: 'كود اللاعب (مثال: P01)', required: true },
        { name: 'اسم اللاعب', label: 'اسم اللاعب', required: true },
        { name: 'الفريق', label: 'الفريق', required: true },
        { name: 'الشهر', label: 'الشهر (مثال: ديسمبر)', required: true },
        { name: 'هل تم الدفع', label: 'حالة الدفع (TRUE أو FALSE)', value: 'TRUE', required: true }
      ], { op: 'add', target: 'subscriptions' });
    }

    function toggleSubscriptionPaid(rowIndex, newStatus) {
      sendWriteRequest({
        op: 'update',
        target: 'subscriptions',
        rowIndex,
        payload: { 'هل تم الدفع': newStatus ? 'TRUE' : 'FALSE' }
      });
    }

    function approveNewPlayer(resp) {
      sendWriteRequest({
        op: 'approve_response',
        target: 'players',
        payload: {
          Player_Name: resp['أسم اللاعب'],
          Parent_Name: resp['اسم الوالد'],
          Parent_Phone: resp['رقم تليفون الوالد'],
          Parent_Email: resp['ايميل الوالد'] || ''
        }
      });
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
